<!-- index.html -->

<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="/_vercel/insights/script.js"></script>
    <meta
      name="Pulaski county community hub"
      content="Resource and information hub about stories and locations in Pulaski county."
    />
    <title>Pulaski County Community Hub</title>

    <link rel="stylesheet" href="styles/header.css">
  </head>



  <!-- content -->
  <body>
    <!-- title -->
    <header class="header-menu">
      <h1 class="header-title">Pulaski County Community Hub</h1>

      <!-- search -->
      <div class="search">
        <form action="/search" method="get">
          <input type="search" name="query" placeholder="Search directory...">
          
          <button type="submit">
            <svg 
              class="w-6 h-6 text-gray-800 dark:text-white" 
              aria-hidden="true" 
              xmlns="http://www.w3.org/2000/svg" 
              width="24" 
              height="24" 
              fill="none"
              viewBox="0 0 24 24"
            >
              <path 
              stroke="rgb(0, 0, 0)" 
              stroke-linecap="round" 
              stroke-width="3" 
              d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
              />
            </svg>
          </button>
        </form>
      </div>
      

      <!-- additional menu links -->
      <nav class="header-links">
        <ul>
          <li><a href="pages/">Directory</a></li>
          <li><a href="pages/">Contact</a></li>
          <li><a href="pages/">FAQ</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
