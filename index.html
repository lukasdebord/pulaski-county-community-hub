<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="/_vercel/insights/script.js"></script>
    <meta
      name="Pulaski county community hub"
      content="Resource and information hub about stories and locations in Pulaski county."
    />
    <title>Pulaski County Community Hub</title>

    <!-- Cinzel Decorative Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/homepage.css">
    <link rel="stylesheet" href="styles/footer.css">

  <!-- content -->
  <body>
    <!-- title -->
    <header class="header-menu">
      <div>
        <a id="header-title" href="index.html">Pulaski County</a>
        <h3 id="header-subtitle">Community Hub</h3>
      </div>
      

      <!-- search -->
      <form class="search" action="/search" method="get">
        <input 
          class="search-items"
          id="header-search-bar" 
          type="search" 
          name="query" 
          placeholder="Search directory..."
        >
        
        <button
          class="search-items" 
          id="header-submit" 
          type="submit"
        >
          <svg 
            class="w-6 h-6 text-gray-800 dark:text-white" 
            aria-hidden="true" 
            xmlns="http://www.w3.org/2000/svg" 
            width="24" 
            height="24" 
            fill="none"
            viewBox="0 0 24 24"
          >
            <path 
            stroke="rgb(0, 0, 0)" 
            stroke-linecap="round" 
            stroke-width="3" 
            d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
            />
          </svg>
        </button>
      </form>
      

      <!-- additional menu links -->
      <nav class="header-links">
        <ul>
          <li><a href="pages/directory.html">Directory</a></li>
          <li><a href="pages/contact.html">Contact</a></li>
          <li><a href="pages/faq.html">FAQ</a></li>
        </ul>
      </nav>
    </header>

    <!-- highlight images -->

        <hr>
      </div>
        
      <nav class="directory-catagory-nav">
        <!-- directory catagory buttons -->
        <button 
          class="directory-catagory-btns" 
          href="#" 
          style="background-image: url(assets/directory/community-empowerment.png);">
          Non-profit Organizations
        </button>
        
        <button 
          class="directory-catagory-btns" 
          href="#"
          style="background-image: url(assets/pexels-clement-couturier-546640561-32802427.jpg);">
          Support Services

        <button

          href="#"
          style="background-image: url(assets/pexels-clement-couturier-546640561-32802427.jpg);">

          class="directory-catagory-btns" 
          href="#"
          style="background-image: url(assets/pexels-clement-couturier-546640561-32802427.jpg);">
          Community Programs

        <button 
          class="directory-catagory-btns" 
          href="#"
          style="background-image: url(assets/pexels-clement-couturier-546640561-32802427.jpg);">
          Other
        </button>
      </nav>
